<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serverless Blog - 79010409</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c2333; --muted:#5d6678; --accent:#2f5bea; --border:#dde1e8; --err:#c62828; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header { background:var(--accent); color:#fff; padding:20px 16px; }
    header h1 { margin:0; font-size:1.4rem; }
    header p { margin:4px 0 0; opacity:.9; }
    main { max-width:760px; margin:0 auto; padding:16px; }
    section { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
    h2 { margin-top:0; font-size:1.1rem; }
    label { display:block; margin:8px 0 4px; font-size:.9rem; color:var(--muted); }
    input, textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font:inherit; }
    button { margin-top:10px; padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.secondary { background:#e8ebf2; color:var(--text); }
    .post { border-top:1px solid var(--border); padding:12px 0; }
    .post:first-child { border-top:0; }
    .post h3 { margin:0 0 4px; }
    .meta { color:var(--muted); font-size:.8rem; }
    .msg { margin-top:8px; font-size:.9rem; }
    .msg.err { color:var(--err); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>Serverless Portfolio &amp; Blog</h1>
    <p>Student ID: <strong id="sid"></strong></p>
  </header>

  <main>
    <section>
      <h2>Portfolio</h2>
      <p>Cloud Computing project hosted on AWS: S3, API Gateway, Lambda, DynamoDB, Cognito and CloudWatch, deployed with AWS SAM.</p>
    </section>

    <section id="auth-box">
      <h2>Login</h2>
      <div id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <button id="login-btn">Login</button>
      </div>
      <div id="logged-in" class="hidden">
        <span>Signed in as <strong id="user-email"></strong></span>
        <button id="logout-btn" class="secondary">Logout</button>
      </div>
      <div id="auth-msg" class="msg"></div>
    </section>

    <section id="create-box" class="hidden">
      <h2>Create a post</h2>
      <label for="title">Title</label>
      <input id="title" maxlength="200">
      <label for="content">Content</label>
      <textarea id="content" rows="4" maxlength="5000"></textarea>
      <button id="post-btn">Publish</button>
      <div id="post-msg" class="msg"></div>
    </section>

    <section>
      <h2>Blog posts</h2>
      <div id="posts">Loading...</div>
    </section>
  </main>

  <!-- config.js is generated by deploy.sh (API URL, Cognito IDs, region, Student ID) -->
  <script src="config.js"></script>
  <script>
    const cfg = window.APP_CONFIG;
    const $ = (id) => document.getElementById(id);
    let idToken = null;

    $('sid').textContent = cfg.studentId;

    function setMsg(id, text, isErr) {
      const el = $(id);
      el.textContent = text;
      el.className = 'msg' + (isErr ? ' err' : '');
    }

    // ---------- Public: list posts ----------
    async function loadPosts() {
      const box = $('posts');
      try {
        const res = await fetch(cfg.apiUrl + '/posts');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const posts = await res.json();
        box.textContent = '';
        if (!posts.length) { box.textContent = 'No posts yet.'; return; }
        for (const p of posts) {
          const div = document.createElement('div');
          div.className = 'post';
          const h = document.createElement('h3');
          h.textContent = p.title;
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = p.author + ' - ' + new Date(p.createdAt).toLocaleString();
          const body = document.createElement('p');
          body.textContent = p.content;
          div.append(h, meta, body);
          box.appendChild(div);
        }
      } catch (e) {
        box.textContent = 'Could not load posts: ' + e.message;
      }
    }

    // ---------- Cognito login (direct API call, no SDK needed) ----------
    async function login() {
      setMsg('auth-msg', 'Signing in...');
      try {
        const res = await fetch('https://cognito-idp.' + cfg.region + '.amazonaws.com/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-amz-json-1.1',
            'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
          },
          body: JSON.stringify({
            AuthFlow: 'USER_PASSWORD_AUTH',
            ClientId: cfg.clientId,
            AuthParameters: { USERNAME: $('email').value.trim(), PASSWORD: $('password').value }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        if (!data.AuthenticationResult) throw new Error('Unexpected challenge: ' + (data.ChallengeName || 'unknown'));
        idToken = data.AuthenticationResult.IdToken;
        $('password').value = '';
        showLoggedIn($('email').value.trim());
        setMsg('auth-msg', '');
      } catch (e) {
        setMsg('auth-msg', e.message, true);
      }
    }

    function showLoggedIn(email) {
      $('login-form').classList.add('hidden');
      $('logged-in').classList.remove('hidden');
      $('create-box').classList.remove('hidden');
      $('user-email').textContent = email;
    }

    function logout() {
      idToken = null;
      $('login-form').classList.remove('hidden');
      $('logged-in').classList.add('hidden');
      $('create-box').classList.add('hidden');
    }

    // ---------- Protected: create post ----------
    async function createPost() {
      setMsg('post-msg', 'Publishing...');
      try {
        const res = await fetch(cfg.apiUrl + '/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': idToken },
          body: JSON.stringify({ title: $('title').value, content: $('content').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.message || 'HTTP ' + res.status);
        $('title').value = '';
        $('content').value = '';
        setMsg('post-msg', 'Post published.');
        loadPosts();
      } catch (e) {
        setMsg('post-msg', e.message, true);
      }
    }

    $('login-btn').addEventListener('click', login);
    $('logout-btn').addEventListener('click', logout);
    $('post-btn').addEventListener('click', createPost);
    loadPosts();
  </script>
</body>
</html>
